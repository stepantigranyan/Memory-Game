<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Memory Game</title>
</head>
<body>
<main class="h-screen bg-cyan-400 p-3 flex flex-col justify-center items-center gap-y-10">
    <h1 class="text-4xl text-cyan-900 uppercase">Memory Game</h1>
    <div class="grid grid-cols-1 items-center gap-y-10">
        <div id="board-container" class="flex flex-col items-center justify-center min-h-80">
            <div class="flex flex-col gap-y-5 items-center">
                <h2 id="game-message" class="text-4xl text-rose-900"></h2>
            </div>
        </div>
        <div class="flex flex-col gap-y-4">
            <div id="mode-buttons">
                <div class="flex flex-col gap-y-4">
                    <h2 id="mode-title" class="text-cyan-900 text-center text-3xl">Choose game mode</h2>
                    <div id="mode-buttons-container" class="flex gap-x-5 justify-center">
                    </div>
                </div>
            </div>
            <span id="timer-container" class="text-4xl text-center text-cyan-900"></span>
            <div class="flex justify-center">
                <div class="flex gap-x-5">
                    <button
                            disabled
                            id="start-button"
                            class="cursor-pointer px-5 py-2 bg-rose-100 border border-rose-400 text-cyan-900 rounded-xl disabled:bg-gray-500 disabled:text-gray-800 disabled:border-gray-800"
                    >
                        Start
                    </button>
                    <button
                            id="stop-button"
                            class="hidden cursor-pointer px-5 py-2 bg-rose-100 border border-rose-400 text-cyan-900 rounded-xl"
                    >
                        Stop
                    </button><button
                        id="continue-button"
                        class="hidden cursor-pointer px-5 py-2 bg-rose-100 border border-rose-400 text-cyan-900 rounded-xl"
                >
                    Continue
                </button>

                    <button
                            disabled
                            id="reset-button"
                            class="hidden cursor-pointer px-5 py-2 bg-rose-100 border border-rose-400 text-cyan-900 rounded-xl disabled:bg-gray-500 disabled:text-gray-800 disabled:border-gray-800"
                    >
                        Reset
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
<script type="module" src="/src/index.js"></script>
</body>
</html>
